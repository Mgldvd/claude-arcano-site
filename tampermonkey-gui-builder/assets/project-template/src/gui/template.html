<section
    class="userscript-panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="userscript-title"
>
    <h2 id="userscript-title">Settings</h2>
    <label for="userscript-value">Value</label>
    <input id="userscript-value" data-field="value" type="text" />
    <p data-role="status" aria-live="polite"></p>
    <div class="userscript-actions">
        <button type="button" data-action="close">Close</button>
        <button type="button" data-action="save">Save</button>
    </div>
</section>
